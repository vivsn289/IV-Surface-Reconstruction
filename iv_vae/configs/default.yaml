# Data configuration
data:
  input_glob: "data/spy_option_*.json"
  cache_path: "artifacts/cache/spy_iv_cache.pt"
  splits_dir: "artifacts/splits"
  k_min: -0.5
  k_max: 0.5
  t_min_days: 7
  t_max_days: 365
  grid_size: 64
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15

# Model configuration
model:
  name: "BetaVAE"
  latent_dim: 32
  beta: 2.0
  tv_lambda: 1.0e-6

# Training configuration
training:
  epochs: 200
  batch_size: 64
  lr: 1.0e-3
  grad_clip: 1.0
  patience: 20
  seed: 42
  device: "cuda" # "cuda" or "cpu"

# Evaluation configuration
evaluation:
  mask_ratios: [0.2, 0.5, 0.8]
  pca_components: [8, 16, 32]
  out_dir: "artifacts"

# Visualization configuration
visualization:
  num_samples: 5
  out_dir: "artifacts/figs"
